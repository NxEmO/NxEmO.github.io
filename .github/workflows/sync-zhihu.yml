name: Sync Zhihu article index

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "zhihu-index"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Zhihu metadata
        run: npm run sync:zhihu
        env:
          ZHIHU_ARTICLES_URL: ${{ secrets.ZHIHU_ARTICLES_URL }}
          ZHIHU_API_TOKEN: ${{ secrets.ZHIHU_API_TOKEN }}

      - name: Commit snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- data/zhihu.json; then
            echo "No Zhihu article changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zhihu.json
          git commit -m "chore: sync Zhihu article index"
          git push

